# The whole app in two containers:
#   docker compose up --build      then open http://localhost:8080
#
# The sa password is read from SA_PASSWORD (set it in the shell or in a .env file).
# The default below is for local development only.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-ClaimDesk_Dev#2026}"
    volumes:
      - claimdesk-data:/var/opt/mssql
    healthcheck:
      # $$ keeps the variable for the container's shell instead of Compose.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # the app migrates the database when it starts
    environment:
      ConnectionStrings__ClaimDesk: "Server=db;Database=ClaimDesk;User Id=sa;Password=${SA_PASSWORD:-ClaimDesk_Dev#2026};TrustServerCertificate=True"
    ports:
      - "8080:8080"

volumes:
  claimdesk-data:
